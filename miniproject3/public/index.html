<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Q&A Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>🤖 Gemini AI Assistant</h1>
        <p>Ask any question below:</p>
        
        <form id="aiForm">
            <input type="text" id="questionInput" placeholder="Enter your question..." required>
            <button type="submit" id="submitBtn">Ask</button>
        </form>

        <div id="answerContainer" class="answer-box hidden">
            <h3>Answer:</h3>
            <p id="answerText"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
