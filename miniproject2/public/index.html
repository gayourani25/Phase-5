<!DOCTYPE html>
<html>
<head>
    <title>AI Daily Journal</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>AI Daily Journal 📝</h1>

        <p>How are you feeling today?</p>

        <input
            id="mood"
            type="text"
            placeholder="happy, stressed, curious"
        >

        <button id="generateBtn">
            Generate Journal Prompt
        </button>

        <div class="result">
            <h2>Your Prompt</h2>
            <p id="prompt">Your prompt will appear here...</p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
